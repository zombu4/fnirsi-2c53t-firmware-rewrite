# at32-noHalt.cfg - debug port and memory access WITHOUT a Cortex-M target: OpenOCD never examines,
# halts or resets the core. With access protection on, a debug session already stops the running
# firmware (it can no longer read its flash; the meter switches off or stays at its logo); halting
# adds nothing useful. Reads and writes go through a mem_ap target on access port 0.
source [find target/swj-dp.tcl]
swj_newdap at32 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x1ba01477
dap create at32.dap -tap at32.cpu
target create at32.ap mem_ap -dap at32.dap -ap-num 0
