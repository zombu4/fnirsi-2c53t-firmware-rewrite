# at32-core.cfg - Cortex-M4 target of the AT32F403A for phase 2 (blank, unprotected chip): halt, RAM
# load and run are allowed there. No flash bank: OpenOCD's artery driver does not know chip ID
# 0x70050344 and drives only the bank-1 controller (FLASHING_BOOTLOADER.md); swd_loader.s programs.
source [find target/swj-dp.tcl]
swj_newdap at32 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x1ba01477
dap create at32.dap -tap at32.cpu
target create at32.cpu cortex_m -endian little -dap at32.dap
at32.cpu configure -work-area-phys 0x20000000 -work-area-size 0x1000
cortex_m reset_config sysresetreq
